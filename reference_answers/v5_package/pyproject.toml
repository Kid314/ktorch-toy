[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktorch-toy-reference"
version = "5.0.0"
description = "A heavily commented local reference implementation of a tiny CPU GPT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ktorch-reference-generate = "ktorch.cli:main"
ktorch-reference-serve = "ktorch.server:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
